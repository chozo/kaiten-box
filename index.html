<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>回転ボックス</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-cell"><span class="lbl">ステージ</span><b id="hud-stage">1/5</b></div>
      <div class="hud-cell"><span class="lbl">手数</span><b id="hud-moves">0</b></div>
      <div class="hud-cell"><span class="lbl">最短</span><b id="hud-par">0</b></div>
    </header>
    <p id="stage-name"></p>

    <div id="stage-wrap">
      <canvas id="cv"></canvas>
    </div>

    <div id="controls">
      <button id="btn-undo" class="side-btn" type="button"><span class="ico">↶</span>戻す</button>
      <div id="pad">
        <button class="dir" data-dir="up" type="button" aria-label="箱をひっくり返す">▲</button>
        <button class="dir" data-dir="left" type="button" aria-label="箱を左に倒す">◀</button>
        <span class="pad-center" aria-hidden="true"></span>
        <button class="dir" data-dir="right" type="button" aria-label="箱を右に倒す">▶</button>
      </div>
      <button id="btn-reset" class="side-btn" type="button"><span class="ico">↺</span>やり直し</button>
    </div>

    <section id="title" class="overlay">
      <div class="card">
        <h1>回転ボックス</h1>
        <p class="lead">ボックスを回転させて、<br>ハムスターを外に出そう。</p>
        <button id="btn-continue" class="big-btn" type="button" hidden>つづきから</button>
        <button id="btn-start" class="big-btn" type="button">はじめる</button>
      </div>
    </section>

    <section id="result" class="overlay" hidden>
      <canvas id="fx-back" aria-hidden="true"></canvas>
      <div class="card">
        <p class="kicker">ぜんステージ クリア</p>
        <h2 id="res-title" class="bounce-title">ぜんぶ脱出！</h2>
        <ul id="res-list"></ul>
        <p id="res-summary"></p>
        <button id="btn-retry" class="big-btn" type="button">1面からもういちど</button>
        <button id="btn-home" class="sub-btn" type="button">タイトルへ</button>
      </div>
    </section>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="toast" aria-live="polite"></div>
  </div>
  <script src="logic.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
